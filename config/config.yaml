# ============================================================
# Micromonas pusilla Introner Project - Master Configuration
# ============================================================
# Central configuration for all analysis workflows
# ============================================================

# Project metadata
project:
  name: "mpusilla_introner_project"
  version: "1.0.0"
  description: "Introner insertion pattern analysis in Micromonas pusilla"

# ============================================================
# SAMPLE DEFINITIONS
# ============================================================

samples:
  # Group 1: Intronerful strains (11 samples)
  # Characterized by high number of introners
  group1:
    - CCMP1545  # Reference strain (also known as 834)
    - RCC114
    - RCC1614   # Has RNA-seq data
    - RCC1698
    - RCC2482
    - RCC373
    - RCC465
    - RCC629
    - RCC692
    - RCC693
    - RCC833

  # Group 2: Intronerless strains (2 samples)
  # Characterized by ~1/4 as many introners as Group 1
  group2:
    - RCC1749   # Reference for Group 2, has RNA-seq data
    - RCC3052

  # All samples (for convenience)
  all:
    - CCMP1545
    - RCC114
    - RCC1614
    - RCC1698
    - RCC1749
    - RCC2482
    - RCC3052
    - RCC373
    - RCC465
    - RCC629
    - RCC692
    - RCC693
    - RCC833

  # Samples with RNA-seq data
  with_rna_seq:
    - CCMP1545
    - RCC1614
    - RCC1749

  # Reference samples
  reference:
    group1: CCMP1545
    group2: RCC1749

  # Excluded samples (not to be used in analysis)
  excluded:
    - RCC835
    - RCC647
    - CCMP490

# ============================================================
# INPUT DATA PATHS
# ============================================================

paths:
  # Original data locations (symlinked to data/)
  original:
    reads: "/scratch1/alex/pusilla/data/reads"
    rna_seq: "/storage1/chris/introner_RNA_seq/fastq"
    r2c2_bams: "/scratch2/russ/introner/splicing_fails/isoforms/expression_differences/realign_r2c2_consensus"

  # Reference genomes
  references:
    ccmp1545: "/scratch1/alex/pusilla/data/ref/v3/MpusillaCCMP1545_228_v3.0.fa"
    ccmp1545_graph: "data/assemblies_original/CCMP1545.vg_paths.fa"
    rcc1749: "/scratch1/alex/pusilla/data/intronerless/jodie/20220622_1749_Jacobs.fasta"
    ccmp1545_gtf: "/scratch1/chris/introner-expression-analysis/gene_annotations/MpusillaCCMP1545_228_v3.0.gene_exons.gtf"
    annotation_info: "/scratch1/chris/mpusilla_go_analysis/mpusilla_ref_assembly/MpusillaCCMP1545_228_v3.0.annotation_info.txt"

  # Pre-computed assemblies (vg_paths.fa files)
  assemblies: "/scratch1/chris/introner-genotyping-pipeline/graph-assemblies"

  # External databases for GO analysis
  external_db:
    interpro2go: "/scratch1/chris/mpusilla_go_analysis/data/interpro2go"
    interpro_to_pfam: "/scratch1/chris/mpusilla_go_analysis/data/interpro_to_pfam.json"
    gene_association_tair: "/scratch1/chris/mpusilla_go_analysis/data/gene_association.tair"
    panther_hmm: "/scratch1/chris/mpusilla_go_analysis/data/PANTHER19.0_HMM_classifications"
    eggnog_data_dir: "data/eggnog_mapper/eggnog_db"

  # Pyrho recombination maps
  pyrho:
    ccmp1545: "/scratch2/russ/mpusilla/pyrho/pyrho_output"
    rcc1749: "/scratch1/chris/introner-group-comparison-analysis/RCC1749_pyrho"

  # 4-fold degenerate site VCF for haplotype diversity analysis
  fourfold_vcf: "/scratch1/chris/introner-genotyping-pipeline/popgen_snp_data/mpusilla.snps.4d.notMT.group1.allsites.vcf.gz"

# ============================================================
# MICRO-C DATASETS
# ============================================================

microc:
  # Start with the smaller pilot run. Switch to "cc15353" once the
  # pilot workflow is validated end-to-end.
  active_dataset: "pilot"

  samples:
    - CCMP1545
    - RCC1614
    - RCC1749

  datasets:
    pilot:
      fastq_dir: "/storage1/chris/introner-micro-c/251205_algaemicroc"
      read_pattern: "{fastq_id}_S*_{read}_001.fastq.gz"
      sample_fastq_ids:
        CCMP1545: "834"
        RCC1614: "1614"
        RCC1749: "1749"

    cc15353:
      fastq_dir: "/storage1/chris/introner-micro-c/CC15353"
      read_pattern: "{fastq_id}_S*_{read}_001.fastq.gz"
      sample_fastq_ids:
        # CCMP1545 is labeled RCC834 in the CC15353 demultiplexed FASTQs.
        CCMP1545: "RCC834"
        RCC1614: "RCC1614"
        RCC1749: "RCC1749"

  alignment:
    bwa_opts: "-5SP"
    mapq: 40
    walks_policy: "5unique"
    max_inter_align_gap: 30
    threads: 24
    samtools_view_threads: 4

  matrix:
    base_resolution: 200
    resolutions: [200, 400, 1000, 2000, 5000, 10000, 25000, 50000]
    threads: 8

  qc:
    # Visual matrix QC
    heatmap_resolution: 5000
    detail_resolution: 1000
    detail_max_chroms: 12
    detail_min_chrom_size: 100000

    # Distance-decay / P(s) QC
    decay_resolution: 1000
    decay_max_distance: 2000000
    decay_log_bins: 80

    # Insulation/domain QC
    insulation_resolution: 1000
    insulation_window: 25000
    insulation_ignore_diags: 2
    insulation_min_boundary_strength: 0.0
    insulation_boundary_threshold_method: li
    insulation_max_plot_chroms: 12
    insulation_min_plot_chrom_size: 100000
    introner_boundary_flank: 5000
    introner_boundary_permutations: 1000
    introner_insulation_permutations: 10000
    introner_boundary_random_seed: 1545
    introner_domain_position_min_chrom_size: 100000
    introner_boundary_excluded_chroms:
      CCMP1545:
        - "CCMP1545#0#scaffold_2"
    chromosome_track_samples:
      - CCMP1545
      - RCC1614
    chromosome_track_chroms: [1, 3, 4, 5]
    chromosome_track_max_distance: 250000
    chromosome_track_introner_bin_bp: 25000

  tracks:
    # Browser-ready nucleosome-scale Micro-C signal tracks.
    # Tracks are CPM-normalized after the same MAPQ/flag filter.
    mapq: 40
    exclude_flags: 3844  # unmapped + secondary + QC fail + duplicate + supplementary
    threads: 8

  introner_profiles:
    # Aggregate anchor signal around genotype-matrix introner boundaries.
    samples:
      - CCMP1545
      - RCC1614
      - RCC1749
    window_bp: 1000
    bin_bp: 10
    absent_max_length: 200
    normal_intron_exclusion_window_bp: 1000

# ============================================================
# OUTPUT PATHS (relative to project root)
# ============================================================

output:
  assemblies: "results/assemblies"
  annotations: "results/annotations"
  genotyping:
    root: "results/genotyping"
    blast_results: "results/genotyping/blast_results"
    ortholog_detection: "results/genotyping/ortholog_detection"
    coverage: "results/genotyping/coverage"
  evolution: "results/evolution"
  snp_popgen:
    root: "results/snp_popgen"
    vcf: "results/snp_popgen/vcf"
    phylogenetics: "results/snp_popgen/phylogenetics"
    demography: "results/snp_popgen/demography"
    selection: "results/snp_popgen/selection"
  expression: "results/expression"
  go_enrichment: "results/go_enrichment"
  figures: "results/figures"
  microc: "results/microc"
  random_forest: "results/random_forest"

# ============================================================
# RANDOM FOREST CLASSIFIER
# ============================================================

random_forest:
  train_sample: CCMP1545
  test_sample: RCC1749

  windows: [25, 50, 100]
  junction_mask_bp: 3
  boundary_max_abs_delta: 25

  excluded_contigs:
    CCMP1545:
      - "CCMP1545#0#scaffold_2"
    RCC1749:
      - "RCC1749#0#intronerless_contig_28"

  orientation:
    mummer_pair:
      - CCMP1545
      - RCC1749
    threshold: 0.8

  enrichment:
    microc_resolution: 1000
    microc_window: 25000
    microc_flank_windows: [25, 50, 250, 500]
    include_expression: true
    include_psi: false
    expression_sample_prefix: "834"

  modeling:
    n_estimators: 500
    random_state: 42
    lofo_negative_mode: same_gene
    lofo_min_test_pos: 20
    lofo_min_test_neg: 20
    preinsertion_controls_per_positive: 1
    matched_gc_col: gc_combined_100
    matched_gc_tolerance: 0.05
    kmer_permutation_repeats: 100

  feature_sets:
    within_sample:
      - composition
      - kmer_left_right
      - all
      - microc
      - kmer_left_right_microc_expression
      - all_microc_codon_expression
    cross_sample_sequence:
      - composition
      - kmer_left_right
      - all
    cross_sample_transfer:
      - composition
      - kmer_left_right
      - all
      - microc
      - kmer_left_right_microc_expression
      - all_microc_codon_expression

# ============================================================
# TOOL PARAMETERS
# ============================================================

params:
  # BLAST parameters for introner detection
  blast:
    identity_threshold: 80       # Minimum percent identity
    length_coverage_min: 0.8     # Minimum query coverage (80%)
    length_coverage_max: 1.2     # Maximum query coverage (120%)
    threads: 5

  # BWA alignment parameters (Phase 1 - strict)
  bwa:
    mapq_threshold: 30           # Minimum mapping quality
    match_length: 70             # Minimum matched bases
    threads: 8

  # BWA rescue parameters (Phase 2 - relaxed for Group1<->Group2)
  bwa_rescue:
    mapq_threshold: 20           # Relaxed from 30
    match_length: 50             # Relaxed from 70
    k: 10                        # Minimum seed length
    W: 10                        # Band width
    r: 1.0                       # Off-diagonal X-dropoff
    A: 1                         # Match score
    B: 2                         # Mismatch penalty

  # Coverage calling parameters
  coverage:
    mapq_threshold: 30           # Minimum MAPQ for depth calculation
    min_depth: 10                # Minimum depth for presence call

  # Flanking region parameters
  flanks:
    extraction_length: 100       # bp to extract on each side
    analysis_lengths: [100, 200] # bp for evolution analysis

  # Similarity validation
  similarity:
    cutoff: 0.7                  # Minimum similarity for validation

  # GATK parameters
  gatk:
    ploidy: 1                    # Haploid organism

  # IQ-TREE parameters
  iqtree:
    model: "AUTO"                # Auto model selection
    bootstrap: 1000              # Bootstrap replicates

  # Dadi parameters
  dadi:
    polarization: "folded"       # Use folded SFS
    conda_env: "workflow/envs/dadi-env"  # Pre-existing conda env with dadi + nlopt

  # MUMmer whole-genome alignment parameters
  mummer:
    min_link_length: 1000        # Minimum synteny block length (bp)
    min_identity: 80.0           # Minimum percent identity for links

  # Circos visualization parameters
  circos:
    gap_threshold: 50000         # Gap threshold for ribbon merging (bp)
    merge_threshold: 750         # Merge threshold for adjacent ribbons (bp)
    remove_contigs: "2,1,33,30,32,40,43,24,42"  # Small/uninformative contigs to exclude
    move_contig: 20              # Contig to reposition
    insert_after: 25             # Insert moved contig after this one
    insert_before: 12            # Insert moved contig before this one
    move_contig_color: "hue080"  # Override color to match contig_25 (green)
    palette_csv: "data/circos/color_palette.csv"              # Optional CSV: chromosome,CCMP1545,RCC1749
    strain_label_size: 36        # Side strain label font size
    strain_label_padding: 25     # Side strain label x padding in pixels
    strain_label_font: ""        # Optional font file for side labels
    pycirclize_link_gradient_steps: 10  # Set 0 to disable gradient-like segmented links
    pycirclize_link_gradient_alpha: 0.55
    pycirclize_link_saturation: 1.35
    pycirclize_link_radius: 72.0
    pycirclize_exclude_sectors: "CCMP1545_0_scaffold_19;CCMP1545_0_scaffold_20;CCMP1545_0_scaffold_21;RCC1749_0_intronerless_contig_27"
    pycirclize_reverse_rcc_link_pairs: "Chr41:Chr4;Chr25:Chr6;Chr10:Chr8;Chr17:Chr10;Chr19:Chr1"

  # Introner positional correlation analysis parameters
  introner_positional:
    window_sizes_kb: [1, 5, 10, 20, 50]
    families: ['all', '1', '2', '3', '4', '14', '15']
    intra_genome_family_pairs:
      - [2, 4]
    intra_genome_genomes: ['CCMP1545', 'RCC1749']
    min_alignment_coverage: 0.5
    exclude_fixed: true

  # GO enrichment parameters
  go:
    min_genes: 5                 # Minimum genes per category
    fdr_threshold: 0.05          # FDR significance threshold
    test: "fisher"               # Statistical test
    kegg_batch_size: 10          # KEGG REST get limit is 10 entries/request
    api_timeout: 30              # HTTP timeout in seconds for GO mapping APIs
    eggnog_prefix: "mp_ccmp1545"
    eggnog_cpus: 16
    eggnog_go_evidence: "non-electronic"
    eggnog_tax_scope: "auto"
    api_max_retries: 3           # Retry transient API failures
    permutation_n: 1000000       # CDS-length-weighted GO permutations
    permutation_threads: 16      # Parallel workers for GO permutations
    permutation_batch_size: 1000 # Permutations per worker task
    permutation_seed: 20260521

  # Group 1 polymorphic introner selective sweep screen
  selection_sweeps:
    window_sizes: [10000, 25000, 50000]
    min_callable_sites: 20
    background_windows_per_focal: 50
    accepted_within_statuses: ["consistent", "singleton"]

# ============================================================
# PLOT CONFIGURATION
# ============================================================

plotting:
  figsize:
    default: [12, 8]
    heatmap: [14, 10]
    small: [8, 6]
  dpi: 300
  format: ["pdf", "png"]

# ============================================================
# RUNTIME CONFIGURATION
# ============================================================

runtime:
  verbose: true
  threads_default: 4
  threads_max: 20

# ============================================================
# MATING TYPE REGION (excluded from some analyses)
# ============================================================

mating_type_region:
  group1:
    contig: "CCMP1545#0#scaffold_2"
    scaffold: "scaffold_2"
    start: 49808
    end: 1730591
  group2:
    contig: "RCC1749#0#intronerless_contig_28"
  # Legacy flat keys used by expression splice-junction rules
  scaffold: "scaffold_2"
  start: 49808
  end: 1730591
